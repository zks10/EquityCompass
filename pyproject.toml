[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklens"
version = "0.1.0"
description = "Beginner-friendly stock research tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pandas",
    "plotly",
    "requests>=2.32,<3",
    "streamlit",
    "yfinance",
]

[project.scripts]
resolve-company = "finance_news.cli:main"
recent-filings = "finance_news.filings_cli:main"
download-filing = "finance_news.download_cli:main"
process-filing = "finance_news.process_cli:main"
extract-sections = "finance_news.sections_cli:main"
financial-facts = "finance_news.facts_cli:main"
financial-history = "finance_news.history_cli:main"
calculate-metrics = "finance_news.metrics_cli:main"
stocklens-pipeline = "finance_news.pipeline_cli:main"
quarterly-pipeline = "finance_news.quarterly_cli:main"
events-pipeline = "finance_news.events_cli:main"

[tool.setuptools.packages.find]
include = ["finance_news*"]
