[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklens"
version = "0.1.0"
description = "Beginner-friendly stock research tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "plotly",
    "requests>=2.32,<3",
    "streamlit",
    "yfinance",
]

[project.scripts]
resolve-company = "finance_news.cli:main"
recent-filings = "finance_news.filings_cli:main"

[tool.setuptools.packages.find]
include = ["finance_news*"]
